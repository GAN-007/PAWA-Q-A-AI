name: PAWA CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  system-one:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip httpx pytest
      - name: Compile modified backend
        run: python -m compileall -q backend
      - name: Run System-One regression tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_system_one.py
